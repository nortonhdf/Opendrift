name: opendrift
channels:
  - conda-forge
dependencies:
  - matplotlib>=3.5
  - numpy>1.23
  - scipy>=1.14
  - libblas=*=*openblas   # force OpenBLAS — MKL builds crashed on Windows/py3.14 (see main/README.md)
  - netcdf4
  - ffmpeg
  - pyproj>=2.3
  - libgdal>=3.1
  - gdal>=3.1
  - xarray=2026.4.*   # pinned to the version the committed products were generated with
  - dask
  - geopandas
  - cfgrib
  - cf_xarray
  - pygrib
  - xhistogram
  - requests
  - pytest<9          # main/tests run with pytest 8.x
  - pytest-cov
  - pytest-benchmark
  - pytest-mpl
  - cartopy>=0.20
  - nc-time-axis
  - geojson
  - pynucos>=2.12
  - isodate
  - coloredlogs
  - cmocean
  - utm
  - roaring-landmask>=0.7
  - adios_db>=1.2,<1.2.7
  - copernicusmarine>=2.0
  - bottleneck
  - python-dotenv
  # Campos Basin dispersion app (main/app.py)
  - streamlit>=1.30
  - plotly>=5.18
  - pandas
  - pip
  - git
  - pip:
    - git+https://github.com/OpenDrift/trajan.git
